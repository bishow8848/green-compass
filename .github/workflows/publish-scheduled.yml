name: Publish scheduled posts

# Ticks the blog's publish job every 15 minutes, on the quarter-hour grid the
# admin schedules on, so a post scheduled for any time of day goes live close
# to it. Vercel Cron (vercel.json) covers the daily 09:00 Nepal Time slot; this
# covers every other time and backs that one up. The job is idempotent, so the
# two overlapping is harmless.
#
# GitHub runs scheduled workflows from the default branch only, and may start
# them a few minutes late when its runners are busy.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SITE_URL: https://greencompasstreks.com
      # Optional. Needed only once CRON_SECRET is set on the Vercel project;
      # add the same value under Settings -> Secrets -> Actions.
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run the publish job
        run: |
          auth=()
          if [ -n "$CRON_SECRET" ]; then auth=(-H "Authorization: Bearer $CRON_SECRET"); fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "${auth[@]}" "$SITE_URL/api/cron/publish-scheduled"
